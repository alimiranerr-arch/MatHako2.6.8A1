name: Project checks

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run smoke tests
        run: npm test
      - name: Check Cloud Functions syntax
        run: node --check functions/index.js
      - name: Validate Firestore and Storage rules in emulators
        run: npx --yes firebase-tools emulators:exec --only firestore,storage --project demo-mathako-check "echo Firebase rules compiled"
